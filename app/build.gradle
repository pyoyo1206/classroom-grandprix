plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'kr.classroom.grandprix'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.classroom.grandprix'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // A fixed key, so a newer APK installs over the old one without uninstalling.
    signingConfigs {
        classroom {
            storeFile file('classroom.keystore')
            storePassword 'grandprix'
            keyAlias 'classroom'
            keyPassword 'grandprix'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.classroom
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
