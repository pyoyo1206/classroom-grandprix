<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>교실 그랑프리</title>
<style>
@font-face{font-family:"Black Han Sans";src:url("fonts/BlackHanSans-Regular.ttf") format("truetype");font-display:swap}
html,body{margin:0}
body{font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: full-bleed 3D race canvas; floating dark "pit wall" panels over it. Single committed look (bright track, dark panels). */
:root{
  --pit:#101727;
  --panel:rgba(16,23,39,.92);
  --panel-2:#1a2438;
  --line:#2c3a57;
  --text:#f3f6fc;
  --muted:#9ba8c4;
  --flag:#ffd23f;
  --hot:#ff4d3d;
  --go:#38d97f;
  --display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--pit);color:var(--text);font-family:var(--body);font-size:15px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#bfe3fb}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.checker{height:10px;border-radius:16px 16px 0 0;background:
  repeating-conic-gradient(#fff 0 25%, #10141f 0 50%) 0 0/10px 10px;opacity:.9}

/* ---------- toolbar ---------- */
#toolbar{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tb:hover{border-color:var(--flag)}
.tb .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tb[aria-pressed="true"] .dot{background:var(--go)}

/* ---------- setup ---------- */
#setup{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(410px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden}
#setup .scroll{overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.18em;color:var(--flag);font-weight:800}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:38px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{font-size:13px;font-weight:800;letter-spacing:.02em}
.field small{font-weight:400;color:var(--muted);margin-left:6px}
input[type=text],textarea,input[type=number]{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:120px;line-height:1.55;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:stretch;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{background:none;border:0;width:40px;font-size:20px;font-weight:800;color:var(--flag)}
.stepper button:hover{background:rgba(255,210,63,.12)}
.stepper input{border:0;border-radius:0;text-align:center;font-family:var(--display);font-size:22px;padding:6px 0;background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:9px 0;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--flag);color:#141a26}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.chip b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1;color:var(--c)}
.chip i{font-style:normal;font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{opacity:.42;border-style:dashed}
.chip[aria-pressed="true"] b{text-decoration:line-through;color:var(--muted)}
.err{margin:0;color:var(--hot);font-weight:800;font-size:13px}
.go{background:var(--hot);border:0;border-radius:12px;padding:14px;font-family:var(--display);font-size:28px;letter-spacing:.04em;color:#fff;box-shadow:0 5px 0 #a8241a;transition:transform .08s}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8241a}
.foot{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hudTitle{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;max-width:calc(100vw - 420px)}
#hudTitle .t{font-family:var(--display);font-size:clamp(22px,3vw,40px);color:#fff;text-shadow:0 3px 0 #10141f,0 0 18px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--flag)}
#rank{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 62px);right:max(12px,env(safe-area-inset-right,0px));width:230px;padding:8px 8px 10px}
#rank h2{margin:0 4px 6px;font-size:11px;letter-spacing:.16em;color:var(--flag);font-weight:800}
#rankRows{position:relative}
.rk{position:absolute;left:0;right:0;height:24px;display:flex;align-items:center;gap:7px;padding:0 4px;transition:transform .35s ease;font-variant-numeric:tabular-nums}
.rk .p{width:22px;text-align:right;font-family:var(--display);color:var(--muted);font-size:15px}
.rk .c{min-width:28px;height:20px;border-radius:5px;background:var(--c);color:#fff;font-family:var(--display);font-size:14px;display:grid;place-items:center;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.rk .n{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .f{width:16px;height:12px;border-radius:2px;background:repeating-conic-gradient(#fff 0 25%,#10141f 0 50%) 0 0/6px 6px;opacity:0}
.rk.done .f{opacity:1}
.rk.done .p{color:var(--flag)}
.rk.lead{background:rgba(255,210,63,.12);border-radius:6px}
#mini{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:180px;height:180px;border-radius:14px}
#cd{position:fixed;z-index:25;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-size:clamp(110px,22vw,260px);color:#fff;text-shadow:0 8px 0 #10141f,0 0 40px rgba(0,0,0,.35)}
#cd.pop span{animation:pop .9s ease-out both}
#cd .goTxt{color:var(--go)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}
#slow{position:fixed;z-index:14;inset:0;pointer-events:none;box-shadow:inset 0 0 0 9999px rgba(0,0,0,0),inset 0 0 180px 40px rgba(0,0,0,.55)}
#slow::before,#slow::after{content:"";position:absolute;left:0;right:0;height:7vh;background:#000}
#slow::before{top:0}#slow::after{bottom:0}
#slow span{position:absolute;left:50%;top:calc(7vh + 16px);transform:translateX(-50%);font-family:var(--display);font-size:clamp(24px,4vw,44px);color:var(--flag);letter-spacing:.08em;text-shadow:0 3px 0 #10141f;white-space:nowrap}
#banner{position:fixed;z-index:16;left:50%;top:22%;transform:translateX(-50%);padding:12px 26px;border-radius:14px;background:var(--flag);color:#141a26;font-family:var(--display);font-size:clamp(22px,3.4vw,38px);white-space:nowrap;box-shadow:0 6px 0 #b8901a;animation:drop .5s ease-out both}
#cap{position:fixed;z-index:17;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);display:flex;align-items:stretch;max-width:min(760px,calc(100vw - 32px));border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#cap .tg{background:var(--hot);color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;padding:10px 12px;display:grid;place-items:center;flex:none}
#cap .tx{background:var(--panel);padding:10px 18px;font-family:var(--display);font-size:clamp(18px,2.6vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#cap.in{animation:capIn .35s ease-out both}
@keyframes capIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
#camLabel{position:fixed;z-index:16;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#camLabel .rec{width:9px;height:9px;border-radius:50%;background:var(--hot);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- results ---------- */
#results{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:calc(100% - 100px);display:flex;flex-direction:column;overflow:hidden}
#results .head{padding:18px 22px 6px;display:flex;flex-direction:column;gap:2px}
#results h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.1;text-wrap:balance}
.resCtl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line)}
.resCtl label{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.resCtl .stepper{height:38px}
.resCtl .stepper input{width:48px;font-size:18px}
.mini-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
.mini-btn:hover{border-color:var(--flag)}
#resList{list-style:none;margin:0;padding:12px 22px;overflow-y:auto;display:grid;gap:6px 18px;grid-auto-flow:column}
#resList li{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;background:var(--panel-2);min-width:0;animation:rise .4s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#resList .o{font-family:var(--display);font-size:24px;width:42px;text-align:center;color:var(--flag);font-variant-numeric:tabular-nums}
#resList .o small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:1px}
#resList .c{min-width:36px;height:28px;border-radius:7px;background:var(--c);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
#resList .n{font-size:17px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#resList li.first{background:rgba(255,210,63,.16);outline:1px solid rgba(255,210,63,.5)}
.resAct{display:flex;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.resAct .go{flex:1;font-size:22px;padding:11px;min-width:150px}
.resAct .ghost{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:800}
.resAct .ghost:hover{border-color:var(--flag)}
#copyBox{margin:0 22px 14px;min-height:80px}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:var(--go);color:#0d2b1a;font-weight:800;padding:10px 18px;border-radius:10px}

@media (max-width:760px){
  #rank{width:150px;padding:6px}
  .rk .n{display:none}
  #mini{width:120px;height:120px}
  #hudTitle{max-width:calc(100vw - 32px);top:calc(env(safe-area-inset-top,0px) + 58px)}
  #resList{grid-auto-flow:row !important;grid-template-rows:none !important}
}
@media (max-height:620px){ .rk{height:19px} .rk .c{height:16px;font-size:12px} }
@media (prefers-reduced-motion:reduce){ .rk{transition:none} #resList li,#banner,#cd.pop span{animation:none} }
</style>

<canvas id="gl" aria-label="자동차 경주 화면"></canvas>

<div id="toolbar">
  <button class="tb" id="tbMode" type="button" title="차 위 이름표 표시 방식">표시: 번호만</button>
  <button class="tb" id="tbSound" type="button" aria-pressed="true"><span class="dot"></span>효과음</button>
  <button class="tb" id="tbFull" type="button">전체화면</button>
  <button class="tb" id="tbSetup" type="button" hidden>설정으로</button>
</div>

<section id="setup" class="panel" aria-label="경주 설정">
  <div class="checker"></div>
  <div class="scroll">
    <header>
      <p class="eyebrow">CLASSROOM GRAND PRIX</p>
      <h1>교실 그랑프리</h1>
      <p class="sub">출발 신호가 울리는 순간 순위가 무작위로 정해지고, 모든 차가 30초 안에 들어옵니다. 들어온 순서가 발표 순서입니다.</p>
    </header>
    <label class="field"><span>경주 제목</span><input id="title" type="text" maxlength="30" placeholder="예: 3반 수행평가 발표 순서"></label>
    <div class="row2">
      <div class="field"><span>출전 차량 수</span>
        <div class="stepper"><button id="cMinus" type="button" aria-label="한 대 줄이기">−</button><input id="count" type="number" min="2" max="20" inputmode="numeric" aria-label="출전 차량 수"><button id="cPlus" type="button" aria-label="한 대 늘리기">+</button></div>
      </div>
      <div class="field"><span>결과 목록 순위 수</span>
        <div class="stepper"><button id="nMinus" type="button" aria-label="하나 줄이기">−</button><input id="topN" type="number" min="1" max="20" inputmode="numeric" aria-label="결과 목록에 보여줄 순위 수"><button id="nPlus" type="button" aria-label="하나 늘리기">+</button></div>
      </div>
    </div>
    <div class="field"><span>차량 표시</span>
      <div class="seg" role="group" aria-label="차량 표시 방식">
        <button type="button" data-mode="num">번호만</button>
        <button type="button" data-mode="name">번호 + 이름</button>
      </div>
    </div>
    <label class="field"><span>이름<small>한 줄에 한 명, 줄 순서가 차 번호</small></span>
      <textarea id="names" rows="6" placeholder="김민준&#10;이서연&#10;박지호&#10;(명렬표에서 복사해 붙여넣어도 됩니다)"></textarea>
    </label>
    <div class="field"><span>결석 제외<small>누르면 이번 경주에서 빠집니다</small></span>
      <div id="chips" class="chips"></div>
    </div>
    <p id="err" class="err" hidden></p>
    <button id="go" class="go" type="button">출발!</button>
    <p class="foot" id="foot"></p>
  </div>
</section>

<div id="hudTitle" hidden><span class="t" id="hudT"></span><span id="clock">0.0</span></div>
<div id="rank" class="panel" hidden><h2>실시간 순위</h2><div id="rankRows"></div></div>
<canvas id="mini" class="panel" width="360" height="360" hidden></canvas>
<div id="slow" hidden><span>결승선 직전!</span></div>
<div id="banner" hidden></div>
<div id="cap" hidden><span class="tg">중계</span><span class="tx"></span></div>
<div id="camLabel" hidden><span class="rec"></span><span id="camTx">공중 중계 · 선두 그룹</span></div>
<div id="cd" aria-live="assertive"></div>

<section id="results" class="panel" hidden aria-label="경주 결과">
  <div class="checker"></div>
  <div class="head">
    <p class="eyebrow">발표 순서</p>
    <h2 id="resTitle"></h2>
  </div>
  <div class="resCtl">
    <label>보여줄 순위
      <span class="stepper"><button id="rMinus" type="button" aria-label="하나 줄이기">−</button><input id="resN" type="number" min="1" max="20" inputmode="numeric" aria-label="보여줄 순위 수"><button id="rPlus" type="button" aria-label="하나 늘리기">+</button></span>
    </label>
    <button class="mini-btn" id="rAll" type="button">전체 보기</button>
  </div>
  <ol id="resList"></ol>
  <textarea id="copyBox" hidden readonly aria-label="복사할 결과"></textarea>
  <div class="resAct">
    <button class="go" id="again" type="button">다시 경주</button>
    <button class="ghost" id="copy" type="button">결과 복사</button>
    <button class="ghost" id="toSetup" type="button">설정 바꾸기</button>
  </div>
</section>
<div id="toast" hidden></div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const KEY='classroom-gp-v1';
const MAXN=20, HALF=13, TW=18, TAU=1.4, K=240;
const COLORS=['#e63946','#1f6fe0','#22a845','#ff9214','#8b44e8','#00aebd','#ff4f9e','#e0b400','#4b5cf0','#ff6430',
              '#109f7a','#b8322a','#3497e6','#86b82c','#cc4fb8','#f07b2a','#26777a','#a65d1c','#6c55e0','#e23d8a'];

/* ---------------- state ---------------- */
let state={title:'발표 순서 정하기',count:20,mode:'num',names:'',absent:[],topN:20,sound:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') Object.assign(state,s);}catch(e){}
state.count=clampInt(state.count,2,MAXN,20);
state.topN=clampInt(state.topN,1,MAXN,state.count);
if(!Array.isArray(state.absent)) state.absent=[];
let saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}},250)}
function clampInt(v,a,b,d){v=parseInt(v,10);if(!isFinite(v))v=d;return Math.max(a,Math.min(b,v))}
function nameOf(n){
  const line=(state.names.split(/\r?\n/)[n-1]||'').trim();
  return line.replace(/^\d{1,2}\s*[\t.)\-:]\s*/,'').replace(/^\d{1,2}\s+(?=\S)/,'').trim();
}
function shownName(n){return state.mode==='name'?nameOf(n):''}
function isAbsent(n){return state.absent.includes(n)}
function activeNums(){const a=[];for(let i=1;i<=state.count;i++) if(!isAbsent(i)) a.push(i);return a}
function cryptoRand(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(cryptoRand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const rnd=(a,b)=>a+Math.random()*(b-a);
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};

/* ---------------- three setup ---------------- */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.5,3000);
scene.fog=new THREE.Fog('#cde8fb',300,1400);
(function sky(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#2f8ff0');gr.addColorStop(.55,'#8cc9fa');gr.addColorStop(1,'#d8effd');
  g.fillStyle=gr;g.fillRect(0,0,4,256);scene.background=new THREE.CanvasTexture(c);})();

/* ---------------- race model ---------------- */
/* Finish order is drawn first. Then a script of standings at a few checkpoints
   (early "rabbit" leader, mid-race shuffles, a late pass at the line) is turned into
   smooth monotone distance curves, and lanes are planned so passes go inside/outside. */
const DT=1/60,KT=[0,3.0,6.5,10.0,13.5,TW-1.4];
let racers=[],order=[],finished=[],lastT=TW,leadEvents=[],leadIdx=0,wideStart=8,wideEnd=11.6,scenario='A',spreadT=4;
const PROF=(function(){const p=new Float32Array(K+1);let acc=0;for(let k=1;k<=K;k++){const u=(k-.5)/K;acc+=(.15+.85*smooth(u/.1))/K;p[k]=acc}for(let k=1;k<=K;k++)p[k]/=acc;return p})();
const PSLOPE=(PROF[K]-PROF[K-1])*K;
function P(u){if(u<=0)return 0;if(u>=1)return 1;const x=u*K,i=Math.floor(x),f=x-i;return PROF[i]+(PROF[i+1]-PROF[i])*f}
const VREF=(L+7)/TW,VEND=VREF*PSLOPE;
const dref=t=>-7+(L+7)*P(t/TW);
function nominal(c,t){return -c.back+(L+c.back)*P(t/c.T)}
function pchip(x,y){const n=x.length,h=[],d=[],m=new Array(n).fill(0);
  for(let i=0;i<n-1;i++){h[i]=x[i+1]-x[i];d[i]=(y[i+1]-y[i])/h[i]}
  for(let i=1;i<n-1;i++){if(d[i-1]*d[i]<=0){m[i]=0;continue}const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}
  m[0]=0;m[n-1]=d[n-2];return m}
function herm(c,t){const kt=c.kt,kd=c.kd,km=c.km,n=kt.length;
  if(t<=0)return kd[0];
  if(t>=kt[n-1])return kd[n-1]+km[n-1]*TAU*(1-Math.exp(-(t-kt[n-1])/TAU));
  let i=0;while(t>kt[i+1])i++;
  const h=kt[i+1]-kt[i],s=(t-kt[i])/h,s2=s*s,s3=s2*s;
  return (2*s3-3*s2+1)*kd[i]+(s3-2*s2+s)*h*km[i]+(-2*s3+3*s2)*kd[i+1]+(s3-s2)*h*km[i+1]}

function standing(cs,pins,score){const n=cs.length,out=new Array(n).fill(null);pins.forEach(([c,i])=>{if(c&&!out.includes(c))placeIn(out,c,i,n)});
  const rest=cs.filter(c=>!out.includes(c)).sort((a,b)=>score(a)-score(b));let j=0;for(let i=0;i<n;i++)if(!out[i])out[i]=rest[j++];return out}

  st.forEach((c,i)=>{if(i>0)d-=gap*rnd(.55,1.45);m.set(c,d)});return m}

  if(t>c.T){const e=1-Math.exp(-(t-c.T)*1.1);l+=(c.exitLane-l)*e}return l}

function prepareRace(){
  const act=activeNums(),n=act.length;
  order=shuffle(act.slice());                       // finishing order, decided here
  const grid=shuffle(act.slice());
  finished=[];leadEvents=[];leadIdx=0;
  cars.forEach(c=>{c.grp.visible=false;c.done=false});
  const cs=order.map((num,r)=>{const c=cars[num-1];c.gi=grid.indexOf(num);const sp=slotOf(c.gi);
    c.rank=r;c.back=sp.back;c.lane0=sp.lane;c.lc=rnd(-6,6);c.la=rnd(1.5,3.5);c.lf=rnd(.2,.45);c.lp=rnd(0,6.28);
    c.exitLane=(r%2?1:-1)*rnd(8.5,11);c.grp.visible=true;return c});
  racers=cs;

  spreadT=Math.max(1.2,Math.min(4.6,1+.19*(n-1)));

  $('#copyBox').hidden=true}
function resultText(){const n=Math.max(1,Math.min(state.topN,order.length));
  return `[${state.title.trim()||'교실 그랑프리'}] 발표 순서\n`+order.slice(0,n).map((num,i)=>{const nm=shownName(num);return `${i+1}. ${num}번${nm?' '+nm:''}`}).join('\n')}
elResN.addEventListener('change',()=>{setTopN(elResN.value,elResN);renderResults()});
$('#rMinus').onclick=()=>{setTopN(state.topN-1);renderResults()};$('#rPlus').onclick=()=>{setTopN(Math.min(order.length,state.topN+1));renderResults()};
$('#rAll').onclick=()=>{setTopN(order.length);renderResults()};
$('#copy').onclick=()=>{const txt=resultText();if(window.AndroidBridge){try{window.AndroidBridge.copy(txt);toast('결과를 복사했습니다');return}catch(e){}}const fb=()=>{const b=$('#copyBox');b.value=txt;b.hidden=false;b.focus();b.select();toast('선택된 글을 Ctrl+C로 복사하세요')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('결과를 복사했습니다'),fb)}catch(e){fb()}};
$('#again').onclick=()=>startRace();
$('#toSetup').onclick=()=>toSetup();$('#tbSetup').onclick=()=>toSetup();

/* ---------------- phases ---------------- */
let phase='setup',raceT=0,realT=0,ts=1,cdT=0,cdShown=0,bannerT=0,orbitA=0,rankTick=0,blend=0,doneT=0;
const cdEl=$('#cd');
function showCd(txt,cls){cdEl.classList.remove('pop');void cdEl.offsetWidth;cdEl.innerHTML=`<span class="${cls||''}">${txt}</span>`;cdEl.classList.add('pop')}
function setView(p){phase=p;$('#setup').hidden=p!=='setup';$('#results').hidden=p!=='done';
  const racing=p==='countdown'||p==='race'||p==='done';['#hudTitle','#rank','#mini'].forEach(s=>$(s).hidden=!racing);$('#tbSetup').hidden=!racing;
  $('#slow').hidden=true;if(p!=='race'){$('#banner').hidden=true;$('#cap').hidden=true;$('#camLabel').hidden=true}resize()}
function startRace(){
  if(activeNums().length<2){const e=$('#err');e.textContent='출전 차량이 2대 이상이어야 합니다. 결석 표시를 확인해 주세요.';e.hidden=false;return}
  $('#err').hidden=true;audio();engineStop();prepareRace();raceT=0;realT=0;ts=1;cam.car=null;cam.dOff=cam.lOff=0;cam.slow=0;cam.span=0;cam.dl=0;cam.wide=0;cam.wInit=false;cam.wSide=Math.random()<.5?1:-1;blend=0;capT=0;firstCap=false;capEl.hidden=true;camLabel.hidden=true;
  $('#hudT').textContent=state.title.trim()||'교실 그랑프리';$('#clock').textContent='0.0';
  setView('countdown');buildRankRows();placeCars(0,0,0);cdT=3.0;cdShown=0;
}
function toSetup(){engineStop();cdEl.innerHTML='';setView('setup');racers=[];}
$('#go').onclick=startRace;
window.gpBack=function(){if(phase!=='setup'){toSetup();return true}return false};
if(window.AndroidBridge)$('#tbFull').hidden=true;
function onFinish(c){finished.push(c);tone(880,.12,'triangle',.18,0,1320);
  if(c.rank===0){const b=$('#banner');b.textContent=`1번째 발표 · ${c.n}번${shownName(c.n)?' '+shownName(c.n):''}`;b.hidden=false;bannerT=2.6;fanfare()}}

const clock=$('#clock'),capEl=$('#cap'),camLabel=$('#camLabel');let last=performance.now(),idleT=0,capT=0,firstCap=false;
function capLabel(c){const nm=shownName(c.n);return `${c.n}번${nm?' '+nm:''}`}
function cap(txt){capEl.querySelector('.tx').textContent=txt;capEl.hidden=false;capEl.classList.remove('in');void capEl.offsetWidth;capEl.classList.add('in');capT=2.4}
function leadCap(e){const A=capLabel(e.p);
  if(e.t>racers[0].T-1.6)return cap(`결승선 앞 대역전! ${A}`);
  cap(e.type==='in'?`${A}, 인코스를 파고들어 선두로!`:e.type==='out'?`${A}, 아웃코스로 돌아 나가며 선두로!`:`${A}, 직선에서 추월하며 선두로!`)}
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;idleT+=rdt;
  if(phase==='setup'){placeIdle(idleT);idlePose(idleT);cPos.lerp(fPos,1-Math.exp(-rdt*3));cLook.lerp(fLook,1-Math.exp(-rdt*3))}
  else if(phase==='countdown'){
    const prev=cdT;cdT-=rdt;const k=Math.ceil(cdT);
    if(k!==cdShown&&k>0){cdShown=k;showCd(k);tone(440,.18,'square',.2)}
    placeCars(0);
    blend=smooth(1-cdT/2.6);followPose(0,rdt);const fp=fPos.clone(),fl=fLook.clone();
    idlePose(idleT);fPos.lerpVectors(fPos,fp,blend);fLook.lerpVectors(fLook,fl,blend);
    cPos.lerp(fPos,1-Math.exp(-rdt*6));cLook.lerp(fLook,1-Math.exp(-rdt*6));
    if(cdT<=0&&prev>0){showCd('출발!','goTxt');tone(880,.55,'square',.24);noise(.6,.08,900);engineStart();phase='race';}
  }
  else if(phase==='race'||phase==='done'){
    const w=racers[0];
    const target=(phase==='race'&&raceT>w.T-1.25&&raceT<w.T+.3)?.28:1;
    ts+=(target-ts)*(1-Math.exp(-rdt*9));
    const dtR=rdt*ts;raceT+=dtR;if(phase==='race')realT+=rdt;
    placeCars(raceT);
    racers.forEach(c=>{if(!c.done&&raceT>=c.T){c.done=true;onFinish(c)}});
    cam.slow+=((ts<.75?1:0)-cam.slow)*(1-Math.exp(-rdt*4));
    $('#slow').hidden=!(phase==='race'&&ts<.7);
    if(phase==='race'){
      clock.textContent=realT.toFixed(1);
      if(!firstCap&&raceT>2.4){firstCap=true;const l=leader(raceT);if(l)cap(`${capLabel(l)}, 출발과 동시에 치고 나갑니다!`)}
      while(leadIdx<leadEvents.length&&leadEvents[leadIdx].t<=raceT){leadCap(leadEvents[leadIdx]);leadIdx++}
      followPose(raceT,rdt);
      const wt=(raceT>wideStart&&raceT<wideEnd)?1:0;cam.wide+=(wt-cam.wide)*(1-Math.exp(-rdt*2.2));
      if(cam.wide>.002&&widePose(raceT,rdt)){const b=smooth(cam.wide);fPos.lerp(wPos,b);fLook.lerp(wLook,b)}else{cam.wide=0;cam.wInit=false}
      camLabel.hidden=!(wt&&cam.wide>.4);if(!camLabel.hidden)$('#camTx').textContent=`공중 중계 · 선두 그룹 ${cam.wG}대`;
      const kk=Math.min(1,realT/.6);cPos.lerp(fPos,kk<1?1-Math.exp(-rdt*12):1);cLook.lerp(fLook,kk<1?1-Math.exp(-rdt*12):1);
      const lead=leader(raceT);if(lead){const sp=(herm(lead,raceT+.05)-lead.dist)/.05;engineSet(Math.min(1.2,sp/60),ts)}
      if(raceT>lastT+1.1){phase='done';engineStop();setView('done');renderResults();updateRank(raceT);fanfare();
        const s=at(0);orbitA=Math.atan2(cPos.z-s.z,cPos.x-s.x)}
    }else{
      orbitA+=rdt*.12;const s=at(0);fPos.set(s.x+Math.cos(orbitA)*46,17,s.z+Math.sin(orbitA)*46);fLook.set(s.x,5,s.z);
      cPos.lerp(fPos,1-Math.exp(-rdt*1.5));cLook.lerp(fLook,1-Math.exp(-rdt*2));
    }
    const tm=1+2.2*smooth(cam.wide);racers.forEach(c=>c.tag.scale.set(c.tagW*tm,c.tagH*tm,1));
    rankTick-=rdt;if(rankTick<=0){rankTick=.12;updateRank(raceT)}
    drawMini(raceT);
    if(bannerT>0){bannerT-=rdt;if(bannerT<=0)$('#banner').hidden=true}
    if(capT>0){capT-=rdt;if(capT<=0)capEl.hidden=true}
  }
  camera.position.copy(cPos);camera.lookAt(cLook);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setPixelRatio(Math.max(1,Math.min(window.devicePixelRatio||1,2,Math.sqrt(3.2e6/Math.max(1,w*h)))));renderer.setSize(w,h,false);camera.aspect=w/h;
  if(phase==='setup'&&w>820){const off=Math.min(250,w*.17);camera.setViewOffset(w,h,-off,0,w,h)}else camera.clearViewOffset();
  camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);
document.addEventListener('keydown',e=>{if(e.key===' '&&phase==='done'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();startRace()}});

/* ---------------- boot ---------------- */
syncMode();syncSound();syncFull();renderChips();updateFoot();redrawAllTextures();
idlePose(0);cPos.copy(fPos);cLook.copy(fLook);resize();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('80px "Black Han Sans"','0123456789가'),document.fonts.load('800 58px "Gothic A1"','가나다')]).then(redrawAllTextures).catch(()=>{})}
})();
</script>

</body>
</html>
